# Qué necesita cada tipo de heladería (contenido de la home anterior, sin cifras sin fuente).
tipos:
  - titulo: Heladería de gelato artesanal
    subtitulo: Equipos e insumos para gelato
    familia: familia-maquinas
    texto: "Producción diaria en lotes pequeños, con una carta de sabores que rota y foco en la calidad."
    necesita:
      - texto: Mantecadora para gelato
        url: /maquinas-helado-artesanal/
      - texto: Bases neutras (Base 50, Neutralin Plus)
        url: /bases-helado-colombia/
      - texto: Pastas concentradas de pistacho o vainilla
        url: /pastas-sabores-helado/
      - texto: Variegatos para vetear el helado
        url: /variegatos-helado/
      - texto: Vitrina para exhibir los sabores
        url: /vitrinas-congeladores/
  - titulo: Punto de helado suave (soft)
    subtitulo: Equipos e insumos para helado suave
    familia: familia-variegatos
    texto: "Servicio rápido, pocos sabores fijos y alto volumen de copas y conos."
    necesita:
      - texto: Máquina de helado suave de mesa o de piso
        url: /maquinas-helado-soft/
      - texto: Base para helado soft (Supergelmix)
        url: /bases-helado-colombia/supergelmix/
      - texto: Coberturas y salsas para la copa
        url: /coberturas-salsas-helado/
  - titulo: Fabricación industrial de helado
    subtitulo: Equipos e insumos para fabricar en volumen
    familia: familia-vitrinas
    texto: "Producción mayorista para distribución, con varios sabores y empaque para reventa."
    necesita:
      - texto: Pasteurizadora y mantecadora industrial
        url: /maquinas-helado-industrial/
      - texto: Bases en presentación de cubeta
        url: /bases-helado-colombia/
      - texto: Pastas y variegatos en formato cubeta
        url: /pastas-sabores-helado/
