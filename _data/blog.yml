# Blog en el sistema Mercato (2026-11-04).
# temas: los 4 grupos del blog. Cada post declara `tema:` y `producto:` en su front matter.
# productos: la caja de producto que va bajo el resumen, el mensaje de WhatsApp y el cierre.
#   cotizar  completa "Vengo del artículo «…» y quiero cotizar ___".
#   Solo productos que Italgel vende (no toppings ni helado listo).

migas:
  - name: Inicio
    url: /
  - name: Blog
    url: /blog/

temas:
  - id: maquinas
    nombre: Máquinas y producción de helado
    titulo: "Producción de helado: overrun, pasteurización y elección de la máquina"
    fondo: banda--papel
    familia: familia-maquinas
    etiqueta: etiqueta--naranja
    texto: Overrun, pasteurización, mantecado y cómo elegir la máquina según los litros que produces.
  - id: ingredientes
    nombre: Bases, pastas y variegatos
    titulo: "Bases, pastas, emulsionantes y variegatos: cómo dosificarlos en el helado"
    fondo: ""
    familia: familia-variegatos
    etiqueta: etiqueta--rosa
    texto: Cómo dosificar bases, pastas, emulsionantes y variegatos para que el helado salga estable.
  - id: negocio
    nombre: Montar y hacer rentable una heladería
    titulo: "Abrir una heladería en Colombia: requisitos, inversión y rentabilidad"
    fondo: banda--mantequilla
    familia: familia-vitrinas
    etiqueta: etiqueta--turquesa
    texto: Requisitos, inversión, márgenes y costos para abrir o crecer una heladería en Colombia.

