<section class="slider">
  <div class="gallery-slider">
    <!-- Cantidad de items para Safari (set original + duplicado) -->
    {% assign marcas = site.data.marcas %}

    <div
      class="slide-container"
      style="--items-count: {{ marcas.size | times: 2 }};"
    >
      <!-- Set original -->
      {% for marca in marcas %}
      <figure>
        <img
          src="{{ marca.img | relative_url }}"
          alt="Logo {{ marca.nombre }}"
          title="{{ marca.title }}"
          loading="lazy"
          decoding="async"
          width="200"
          height="80"
        />
      </figure>
      {% endfor %}

      <!-- Set duplicado para loop (decorativo: sin alt ni title) -->
      {% for marca in marcas %}
      <figure aria-hidden="true">
        <img
          src="{{ marca.img | relative_url }}"
          alt=""
          loading="lazy"
          decoding="async"
          width="200"
          height="80"
        />
      </figure>
      {% endfor %}
    </div>
  </div>
</section>
