{%- comment -%}
  Fotografía de tarjeta normalizada desde el catálogo, con variantes sin ampliación artificial.
  Datos: _data/imagenes_cafe.json. Las imágenes principales de las fichas conservan su original.
{%- endcomment -%}
{%- assign _foto_cafe = site.data.imagenes_cafe[include.slug] -%}
<img src="{{ _foto_cafe.src | relative_url }}" srcset="{% for variante in _foto_cafe.variants %}{{ variante.src | relative_url }} {{ variante.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: 'auto, (min-width: 60rem) 256px, (min-width: 40rem) 28vw, 44vw' }}" alt="{{ include.alt | escape }}" title="{{ include.title | default: include.alt | escape }}" width="{{ _foto_cafe.width }}" height="{{ _foto_cafe.height }}" loading="lazy" decoding="async">
