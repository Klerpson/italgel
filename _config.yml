markdown: kramdown

permalink: :slug/

# Excluir archivos y carpetas del build
# NOTA: En Jekyll, 'exclude' SOBRESCRIBE los defaults, no los extiende.
# Por eso listamos TODO explícitamente.
exclude:
  - ".kilo"
  - ".remember"
  - ".claude"
  - ".agents"
  - "plans" # legado: la carpeta se renombro a _plans (ya excluida por Jekyll por el guion bajo)
  - "AGENTS.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
  - ".sass-cache"
  - ".jekyll-cache"
  - "README.md"
  - "_headers"
  - "Claude outputs"

keep_files: [/img]

compress_html:
  clippings: []
  comments: []
  endings: []
  ignore:
  envs: []
  blanklines: false
  profile: false
  startings: []

collections:
  posts:
    output: true
    permalink: /blog/:slug/
  redirects:
    output: true
    permalink: /:slug/
