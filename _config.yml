logo: img/logo.avif
social_image: img/contacto-italgel-colombia.jpg
author: Sebastián Rios
telefono: 573192346788
# Mensaje de WhatsApp: wa_mensaje + h1 (o titulo) de la pagina; en la portada
# y paginas sin titulo, wa_mensaje + wa_asunto. Lo usan _includes/wa-mensaje.html
# (body data-wa-message) y _includes/wa-href.html (href wa.me de los botones).
wa_mensaje: "¡Hola! Soy dueño o encargado de una heladería y quiero cotizar"
wa_asunto: "insumos o equipos"
email: info@mec3.co
direccion: "Carrera 68H No. 75 - 33, Bogotá, Colombia"
nit: "9006898237"
redes:
  - nombre: Facebook
    url: https://www.facebook.com/Mec3.Italgel
  - nombre: Instagram
    url: https://www.instagram.com/mec3colombia/

markdown: kramdown

permalink: :slug/

# Excluir archivos y carpetas del build
# NOTA: En Jekyll, 'exclude' SOBRESCRIBE los defaults, no los extiende.
# Por eso listamos TODO explícitamente.
exclude:
  - ".kilo"
  - ".remember"
  - ".claude"
  - ".agents"
  - "plans" # legado: la carpeta se renombro a _plans (ya excluida por Jekyll por el guion bajo)
  - "AGENTS.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
  - ".sass-cache"
  - ".jekyll-cache"
  - "README.md"
  - "_headers"
  - "Claude outputs"

keep_files: [/img]

compress_html:
  clippings: []
  comments: []
  endings: []
  ignore:
  envs: []
  blanklines: false
  profile: false
  startings: []

collections:
  posts:
    output: true
    permalink: /blog/:slug/
  redirects:
    output: true
    permalink: /:slug/
